<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Sísmico Diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg: #0B0F14;
    --bg-panel: #12181F;
    --bg-panel-2: #161E27;
    --line: #202A35;
    --text: #E8ECEF;
    --text-muted: #7C8A99;
    --amber: #F2A93B;
    --red: #E85D4C;
    --teal: #4BC9C0;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  a{ color: inherit; }

  /* ---------- HEADER / SEISMOGRAPH SIGNATURE ---------- */
  header{
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(242,169,59,0.06), transparent 70%),
      var(--bg-panel);
  }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 10px;
  }

  .eyebrow .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
    animation: pulse 1.8s infinite ease-in-out;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; transform: scale(1); }
    50%{ opacity:.4; transform: scale(0.8); }
  }

  h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(26px, 7vw, 34px);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .subtitle{
    color: var(--text-muted);
    font-size: 13.5px;
    margin-bottom: 18px;
  }

  #trace-wrap{
    width: 100%;
    height: 64px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  #trace{ width:100%; height:100%; display:block; }

  /* ---------- STATS ---------- */
  .stats{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat{
    background: var(--bg-panel);
    padding: 16px 12px;
    text-align:center;
  }
  .stat .value{
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: clamp(20px, 6vw, 26px);
    color: var(--amber);
  }
  .stat.max .value{ color: var(--red); }
  .stat.depth .value{ color: var(--teal); }
  .stat .label{
    margin-top: 4px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ---------- MAP ---------- */
  #map{
    height: 320px;
    width: 100%;
    border-bottom: 1px solid var(--line);
    filter: saturate(0.85);
  }

  /* ---------- SECTION LABEL ---------- */
  .section-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 22px 20px 10px;
    display:flex;
    justify-content: space-between;
  }

  /* ---------- LIST ---------- */
  #lista{
    display:flex;
    flex-direction: column;
  }

  .sismo{
    display:flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    gap: 14px;
    text-decoration:none;
    color: inherit;
  }

  .mag-badge{
    flex: 0 0 54px;
    height: 54px;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 18px;
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
  }

  .mag-low{ color: var(--teal); border-color: rgba(75,201,192,0.35); }
  .mag-mid{ color: var(--amber); border-color: rgba(242,169,59,0.4); }
  .mag-high{ color: var(--red); border-color: rgba(232,93,76,0.5); }

  .sismo-info{
    flex:1;
    min-width:0;
  }
  .sismo-lugar{
    font-size: 14.5px;
    font-weight: 500;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sismo-meta{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-muted);
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ---------- FOOTER ---------- */
  footer{
    padding: 24px 20px 10px;
    text-align:center;
    font-size: 11.5px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  #estado{
    padding: 40px 20px;
    text-align:center;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 13px;
  }

  @media (min-width: 640px){
    .stats{ grid-template-columns: repeat(3, 1fr); }
    #map{ height: 420px; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="dot"></span>Monitoreo en vivo · datos vía GitHub</div>
  <h1>Actividad Sísmica</h1>
  <div class="subtitle" id="fecha-consulta">Cargando última consulta…</div>
</header>

<div id="trace-wrap"><svg id="trace"></svg></div>

<div class="stats">
  <div class="stat total">
    <div class="value" id="stat-total">–</div>
    <div class="label">Sismos hoy</div>
  </div>
  <div class="stat max">
    <div class="value" id="stat-max">–</div>
    <div class="label">Magnitud máx.</div>
  </div>
  <div class="stat depth">
    <div class="value" id="stat-depth">–</div>
    <div class="label">Profund. media (km)</div>
  </div>
</div>

<div id="map"></div>

<div class="section-label"><span>Registro de eventos</span><span id="orden-label">más recientes</span></div>
<div id="estado">Cargando datos sísmicos…</div>
<div id="lista"></div>

<footer>
  Datos generados diariamente con Python · Fuente: GitHub<br>
  Actualizado automáticamente en cada commit
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ============ CONFIGURA AQUÍ TU URL ============
  // Reemplaza esto por la URL "raw" de tu JSON en GitHub, por ejemplo:
  // https://raw.githubusercontent.com/tu-usuario/tu-repo/main/sismos.json
  const JSON_URL = "https://raw.githubusercontent.com/Zakkaryas/Earthquakes/refs/heads/main/historial_sismos.json";
  // =================================================

  function colorClase(mag){
    if(mag >= 4.5) return "mag-high";
    if(mag >= 3) return "mag-mid";
    return "mag-low";
  }

  function dibujarTrazo(sismos){
    const svg = document.getElementById('trace');
    const w = svg.clientWidth || 400;
    const h = svg.clientHeight || 64;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

    const ordenados = [...sismos].reverse();
    const n = ordenados.length;
    if(n === 0) return;

    const maxMag = Math.max(...ordenados.map(s => s.magnitud), 1);
    const step = w / (n - 1 || 1);
    let d = `M 0 ${h/2}`;
    ordenados.forEach((s, i) => {
      const x = i * step;
      const amp = (s.magnitud / maxMag) * (h * 0.42);
      const y = h/2 + (i % 2 === 0 ? -amp : amp);
      d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
    });
    d += ` L ${w} ${h/2}`;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#F2A93B");
    path.setAttribute("stroke-width", "1.6");
    path.setAttribute("opacity", "0.85");
    svg.appendChild(path);
  }

  function renderStats(data){
    document.getElementById('stat-total').textContent = data.total_sismos_detectados ?? data.sismos.length;
    const magMax = Math.max(...data.sismos.map(s => s.magnitud));
    document.getElementById('stat-max').textContent = magMax.toFixed(1);
    const profMedia = data.sismos.reduce((a,s) => a + (s.profundidad_km||0), 0) / data.sismos.length;
    document.getElementById('stat-depth').textContent = profMedia.toFixed(1);
    document.getElementById('fecha-consulta').textContent = "Última consulta: " + data.fecha_consulta;
  }

  function renderLista(sismos){
    const cont = document.getElementById('lista');
    cont.innerHTML = "";
    const ordenados = [...sismos].sort((a,b) => new Date(b.fecha_evento) - new Date(a.fecha_evento));

    ordenados.forEach(s => {
      const item = document.createElement('div');
      item.className = "sismo";
      item.innerHTML = `
        <div class="mag-badge ${colorClase(s.magnitud)}">${s.magnitud.toFixed(1)}</div>
        <div class="sismo-info">
          <div class="sismo-lugar">${s.lugar}</div>
          <div class="sismo-meta">
            <span>${s.fecha_evento}</span>
            <span>${s.profundidad_km.toFixed(1)} km prof.</span>
          </div>
        </div>
      `;
      cont.appendChild(item);
    });
  }

  function renderMapa(sismos){
    const map = L.map('map', { zoomControl: true, attributionControl: true })
      .setView([sismos[0].latitud, sismos[0].longitud], 3);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    sismos.forEach(s => {
      const color = s.magnitud >= 4.5 ? '#E85D4C' : (s.magnitud >= 3 ? '#F2A93B' : '#4BC9C0');
      const radio = 4 + s.magnitud * 2.2;
      L.circleMarker([s.latitud, s.longitud], {
        radius: radio,
        color: color,
        weight: 1,
        fillColor: color,
        fillOpacity: 0.45
      })
      .bindPopup(`<b>${s.lugar}</b><br>Magnitud ${s.magnitud}<br>${s.fecha_evento}<br>${s.profundidad_km} km de profundidad`)
      .addTo(map);
    });
  }

  async function cargarDatos(){
    try{
      const res = await fetch(JSON_URL, { cache: "no-store" });
      if(!res.ok) throw new Error("No se pudo cargar el JSON (" + res.status + ")");
      const data = await res.json();

      document.getElementById('estado').style.display = "none";
      renderStats(data);
      dibujarTrazo(data.sismos);
      renderLista(data.sismos);
      renderMapa(data.sismos);
    }catch(err){
      document.getElementById('estado').textContent = "Error al cargar los datos: " + err.message;
    }
  }

  cargarDatos();
</script>
</body>
</html>
